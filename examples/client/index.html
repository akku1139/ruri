<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ruri · client example</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #17171d;
      --border: #26262f;
      --text: #e8e8ee;
      --muted: #8b8b99;
      --accent: #e11d48;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .container { width: min(560px, 100% - 32px); padding: 48px 0; }
    .header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
    .header h1 { margin: 0; font-size: 28px; letter-spacing: 0.5px; }
    .tagline { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card h2 { margin: 0 0 12px; font-size: 18px; }
    .counter { font-size: 20px; margin: 0 0 12px; font-variant-numeric: tabular-nums; }
    .accent { color: var(--accent); }
    .row { display: flex; gap: 8px; }
    button {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    input[type="text"] {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      padding: 8px 12px;
      font-size: 14px;
    }
    .todo-list { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 6px; }
    .todo-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .todo-list li.done label { text-decoration: line-through; color: var(--muted); }
    .todo-list label { flex: 1; cursor: pointer; }
    .todo-list .remove { border: none; color: var(--muted); font-size: 18px; padding: 0 6px; }
    .todo-list .remove:hover { color: var(--accent); }
    .meta { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <script type="module" src="./app.js"></script>
</body>
</html>
