name: Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Run benchmarks
        env:
          NODE_OPTIONS: --conditions=browser
        run: node run.mjs
        working-directory: bench

      - name: Post results to the benchmark issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="📊 Benchmark Results"
          ISSUE=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -z "$ISSUE" ]; then
            ISSUE=$(gh issue create --title "$TITLE" --body "Automated benchmark runs are archived here.")
          fi
          {
            echo "**Commit:** [\`${GITHUB_SHA::7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) · runner: ubuntu-latest"
            echo "_Timings on shared CI hardware are noisy - compare medians across runs with care._"
            echo
            cat bench-results.md
          } > comment.md
          gh issue comment "$ISSUE" --body-file comment.md
