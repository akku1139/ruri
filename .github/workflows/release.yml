name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      # npm Trusted Publisher: exchange the workflow OIDC token for a
      # short-lived registry credential. No NPM_TOKEN secret is needed.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Build
        run: |
          pnpm install
          pnpm build

      - name: Publish to npm (Trusted Publisher)
        run: npm publish --access public --provenance
