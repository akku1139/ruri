name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      # npm Trusted Publisher: exchange the workflow OIDC token for a
      # short-lived registry credential. No NPM_TOKEN secret is needed.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # Node 24 ships npm 11+, which implements trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - name: Build
        run: |
          pnpm install
          pnpm build

      - name: Publish to npm (Trusted Publisher)
        run: npm publish --access public --provenance
